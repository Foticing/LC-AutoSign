name: Cleanup Old Workflow Runs
on:
  # 每周日 00:00 自动运行
  schedule:
    - cron: '0 0 * * 0'
  # 支持手动触发
  workflow_dispatch:
    inputs:
      retain_days:
        description: '保留多少天内的运行记录'
        required: false
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '7'
          - '14'

jobs:
  cleanup-runs:
    name: Cleanup Old Workflow Runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate token permissions
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows")
          if [ "$code" != "200" ]; then
            echo "❌ Token 无效或权限不足，HTTP $code"
            exit 1
          fi
          echo "✅ Token 有效，可访问 Actions API（HTTP 200）"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event.inputs.retain_days || '3' }}
          keep_minimum_runs: 5
          # 省略 delete_workflow_pattern = 清理所有 workflow 的运行记录。
          # 切勿传 'all'：它只是普通字符串，按 workflow 名字/文件名做子串匹配，
          # 匹配不到任何 workflow（日志表现为 Processing 0 workflow(s)）

      - name: Notify cleanup completion
        if: success()
        run: |
          echo "✅ Workflow runs cleanup completed successfully"
          echo "Repository: ${{ github.repository }}"
          echo "Retain days: ${{ github.event.inputs.retain_days || '3' }}"
          echo "Minimum runs kept: 5"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Workflow runs cleanup failed"
          echo "Please check the workflow permissions (actions: write) and repository settings"
